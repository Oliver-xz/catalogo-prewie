<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Oficial | Streetwear, Gorras & Perfumes</title>
  <style>
    :root {
      --bg: #0f0f11;
      --card: #1a1a1f;
      --text: #f4f4f6;
      --muted: #9ca3af;
      --accent: #25d366; /* Verde WhatsApp */
      --accent-dark: #1ebe5d;
      --border: #2c2c35;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 90px; }
    
    header {
      background: #141418;
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.2rem; letter-spacing: 1px; text-transform: uppercase; }
    .cart-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Filtros */
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px;
      background: var(--bg);
      position: sticky;
      top: 60px;
      z-index: 90;
    }
    .filter-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .filter-btn.active { background: var(--text); color: var(--bg); font-weight: bold; }

    /* Grid de Productos */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 14px;
      padding: 16px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #25252d;
    }
    .card-body { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
    .tag { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
    .title { font-size: 0.95rem; font-weight: 600; line-height: 1.2; }
    .price { font-size: 1.05rem; font-weight: 800; color: var(--accent); }
    
    select {
      width: 100%;
      padding: 6px;
      background: #25252d;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .add-btn {
      width: 100%;
      padding: 9px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      margin-top: auto;
    }
    .add-btn:active { transform: scale(0.98); }

    /* Modal Carrito */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      justify-content: flex-end;
    }
    .modal.open { display: flex; }
    .drawer {
      background: var(--card);
      width: 100%;
      max-width: 400px;
      height: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
    }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .close-btn { background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; }
    .cart-items { flex-grow: 1; overflow-y: auto; margin: 16px 0; display: flex; flex-direction: column; gap: 12px; }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      padding: 10px;
      border-radius: 8px;
    }
    .qty-controls button {
      background: var(--border);
      color: white;
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 4px;
      cursor: pointer;
    }
    .checkout-form input, .checkout-form select {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: white;
      border-radius: 8px;
    }
    .wa-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <h1>Catálogo Oficial</h1>
  <button class="cart-btn" onclick="toggleCart()">🛒 Pedido (<span id="cart-count">0</span>)</button>
</header>

<div class="filters">
  <button class="filter-btn active" onclick="filterCategory('Todos', this)">Todos</button>
  <button class="filter-btn" onclick="filterCategory('Playeras', this)">Playeras Oversize</button>
  <button class="filter-btn" onclick="filterCategory('Gorras', this)">Gorras</button>
  <button class="filter-btn" onclick="filterCategory('Perfumes', this)">Perfumes</button>
  <button class="filter-btn" onclick="filterCategory('Mystery Box', this)">Mystery Box</button>
</div>

<div class="grid" id="product-grid"></div>

<!-- Carrito Lateral -->
<div class="modal" id="cart-modal">
  <div class="drawer">
    <div>
      <div class="drawer-header">
        <h2>Tu Pedido</h2>
        <button class="close-btn" onclick="toggleCart()">✕</button>
      </div>
      <div class="cart-items" id="cart-items"></div>
    </div>

    <div class="checkout-form">
      <div style="display:flex; justify-content:space-between; font-size:1.2rem; font-weight:bold; margin-bottom:14px;">
        <span>Total:</span>
        <span id="cart-total">$0 MXN</span>
      </div>
      <input type="text" id="client-name" placeholder="Tu nombre completo *" required>
      <select id="delivery-type">
        <option value="Envío a domicilio">Envío a domicilio</option>
        <option value="Entrega personal / Punto medio">Entrega personal / Punto medio</option>
      </select>
      <button class="wa-btn" onclick="sendWhatsApp()">📲 Enviar pedido por WhatsApp</button>
    </div>
  </div>
</div>

<script>
  // 1. NÚMERO DE WHATSAPP DE TU CLIENTE (52 + 10 dígitos en México)
  const TELEFONO_CLIENTE = "5215500000000";

  // 2. LISTA DE PRODUCTOS (Extraídos de tus capturas)
  // Cambia los precios provisionales (450, 350, etc.) y pon la ruta de tus fotos en "img/..."
  const productos = [
    // PLAYERAS OVERSIZE
    { id: 1, nombre: "Hellstar Negra Flamas Blancas", categoria: "Playeras", precio: 450, opciones: ["S Oversize", "M Oversize", "L Oversize"], imagen: "Hellstar_Negra_Flamas_Blancas.jpg" },
    { id: 2, nombre: "Hellstar Negra Logo Rosa", categoria: "Playeras", precio: 450, opciones: ["S Oversize", "M Oversize", "L Oversize"], imagen: "https://placehold.co/300x300/1a1a1f/pink?text=Hellstar+Rosa" },
    { id: 3, nombre: "Chrome Hearts Negra Cruz Blanca", categoria: "Playeras", precio: 450, opciones: ["S Oversize", "M Oversize", "L Oversize"], imagen: "https://placehold.co/300x300/1a1a1f/white?text=Chrome+Hearts+Blanca" },
    { id: 4, nombre: "Chrome Hearts Negra Cruz Rosa", categoria: "Playeras", precio: 450, opciones: ["S Oversize", "M Oversize", "L Oversize"], imagen: "https://placehold.co/300x300/1a1a1f/pink?text=Chrome+Hearts+Rosa" },
    { id: 5, nombre: "Hellstar Records Morada", categoria: "Playeras", precio: 450, opciones: ["S Oversize", "M Oversize", "L Oversize"], imagen: "https://placehold.co/300x300/1a1a1f/violet?text=Hellstar+Records" },
    { id: 6, nombre: "Essentials Fear Of God Negra", categoria: "Playeras", precio: 450, opciones: ["S Oversize"], imagen: "Essentials_Negra.jpg" },
    { id: 7, nombre: "Godspeed Estatua Libertad Blanca", categoria: "Playeras", precio: 450, opciones: ["S Oversize"], imagen: "https://placehold.co/300x300/eeeeee/111?text=Godspeed+Blanca" },

    // GORRAS
    { id: 8, nombre: "Gorra Bélica (Indicar modelo/color)", categoria: "Gorras", precio: 350, opciones: ["Ajustable"], imagen: "https://placehold.co/300x300/1a1a1f/white?text=Gorra+Belica" },
    { id: 9, nombre: "Gorra 9FORTY Semicurva MLB", categoria: "Gorras", precio: 380, opciones: ["Semicurva Ajustable"], imagen: "https://placehold.co/300x300/1a1a1f/white?text=9FORTY+Semicurva" },
    { id: 10, nombre: "Gorra 9FIFTY Broche Plana", categoria: "Gorras", precio: 380, opciones: ["Broche Plana"], imagen: "https://placehold.co/300x300/1a1a1f/white?text=9FIFTY+Plana" },
    { id: 11, nombre: "Gorra Cerrada Talla 7 (55.8 cm)", categoria: "Gorras", precio: 400, opciones: ["Talla 7 / 55.8 cm"], imagen: "https://placehold.co/300x300/1a1a1f/white?text=Gorra+Talla+7" },

    // PERFUMES
    { id: 12, nombre: "Odyssey Mandarin Sky", categoria: "Perfumes", precio: 750, opciones: ["100 ml"], imagen: "Odyssey_Mandarin_Sky.jpg" },
    { id: 13, nombre: "Jean Paul Gaultier Le Male Elixir", categoria: "Perfumes", precio: 850, opciones: ["125 ml"], imagen: "https://placehold.co/300x300/b8860b/white?text=JPG+Elixir" },
    { id: 14, nombre: "Hawas Ice For Him", categoria: "Perfumes", precio: 800, opciones: ["100 ml"], imagen: "https://placehold.co/300x300/0055aa/white?text=Hawas+Ice" },
    { id: 15, nombre: "Afnan 9 PM Parfum", categoria: "Perfumes", precio: 750, opciones: ["100 ml"], imagen: "https://placehold.co/300x300/111111/white?text=Afnan+9PM" },
    { id: 16, nombre: "Dior Sauvage Parfum", categoria: "Perfumes", precio: 850, opciones: ["100 ml"], imagen: "Sauvage.jpg" },

    // MYSTERY BOXES (Precios exactos de tu captura)
    { id: 17, nombre: "Mystery Box Perfumes (3 piezas)", categoria: "Mystery Box", precio: 1199, opciones: ["Caja 3 Piezas"], imagen: "https://placehold.co/300x300/8b0000/white?text=Mystery+Box+3+Pzs" },
    { id: 18, nombre: "Mystery Box Perfumes (5 piezas)", categoria: "Mystery Box", precio: 1649, opciones: ["Caja 5 Piezas"], imagen: "Mystery_Box_Perfumes_5piezas.jpg" },
    { id: 19, nombre: "Mystery Box Perfumes (10 piezas)", categoria: "Mystery Box", precio: 2995, opciones: ["Caja 10 Piezas"], imagen: "https://placehold.co/300x300/8b0000/white?text=Mystery+Box+10+Pzs" },
    { id: 20, nombre: "Mystery Box Perfumes (20 piezas)", categoria: "Mystery Box", precio: 5499, opciones: ["Caja 20 Piezas"], imagen: "https://placehold.co/300x300/8b0000/white?text=Mystery+Box+20+Pzs" }
  ];

  let cart = [];

  function renderProducts(lista) {
    const grid = document.getElementById("product-grid");
    grid.innerHTML = lista.map(p => `
      <div class="card">
        <img src="${p.imagen}" alt="${p.nombre}">
        <div class="card-body">
          <span class="tag">${p.categoria}</span>
          <div class="title">${p.nombre}</div>
          <div class="price">$${p.precio.toLocaleString()} MXN</div>
          <select id="opt-${p.id}">
            ${p.opciones.map(o => `<option value="${o}">${o}</option>`).join("")}
          </select>
          <button class="add-btn" onclick="addToCart(${p.id})">+ Agregar</button>
        </div>
      </div>
    `).join("");
  }

  function filterCategory(cat, btn) {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const filtrados = cat === "Todos" ? productos : productos.filter(p => p.categoria === cat);
    renderProducts(filtrados);
  }

  function addToCart(id) {
    const prod = productos.find(p => p.id === id);
    const opcion = document.getElementById(`opt-${id}`).value;
    const key = `${id}-${opcion}`;
    const existing = cart.find(item => item.key === key);

    if (existing) {
      existing.qty++;
    } else {
      cart.push({ key, nombre: prod.nombre, precio: prod.precio, opcion, qty: 1 });
    }
    updateCartUI();
  }

  function changeQty(key, delta) {
    const item = cart.find(i => i.key === key);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) cart = cart.filter(i => i.key !== key);
    updateCartUI();
  }

  function updateCartUI() {
    const count = cart.reduce((acc, i) => acc + i.qty, 0);
    const total = cart.reduce((acc, i) => acc + (i.precio * i.qty), 0);
    document.getElementById("cart-count").innerText = count;
    document.getElementById("cart-total").innerText = `$${total.toLocaleString()} MXN`;

    const container = document.getElementById("cart-items");
    if (cart.length === 0) {
      container.innerHTML = "<p style='color:#9ca3af; text-align:center;'>Tu carrito está vacío.</p>";
      return;
    }

    container.innerHTML = cart.map(item => `
      <div class="cart-item">
        <div>
          <div style="font-weight:bold; font-size:0.9rem;">${item.nombre}</div>
          <div style="font-size:0.8rem; color:#9ca3af;">${item.opcion} • $${item.precio} c/u</div>
        </div>
        <div class="qty-controls">
          <button onclick="changeQty('${item.key}', -1)">-</button>
          <span style="margin:0 6px;">${item.qty}</span>
          <button onclick="changeQty('${item.key}', 1)">+</button>
        </div>
      </div>
    `).join("");
  }

  function toggleCart() {
    document.getElementById("cart-modal").classList.toggle("open");
  }

  function sendWhatsApp() {
    if (cart.length === 0) return alert("Agrega al menos un producto.");
    const name = document.getElementById("client-name").value.trim();
    if (!name) return alert("Por favor escribe tu nombre.");
    const delivery = document.getElementById("delivery-type").value;

    let msg = `¡Hola! Quiero hacer el siguiente pedido:%0A%0A`;
    msg += `👤 *Cliente:* ${name}%0A`;
    msg += `🚚 *Entrega:* ${delivery}%0A%0A`;
    msg += `*Productos:*%0A`;

    let total = 0;
    cart.forEach(item => {
      const sub = item.precio * item.qty;
      total += sub;
      msg += `▪ ${item.qty}x ${item.nombre} (${item.opcion}) - $${sub.toLocaleString()}%0A`;
    });

    msg += `%0A💰 *TOTAL A PAGAR: $${total.toLocaleString()} MXN*`;

    window.open(`https://wa.me/${TELEFONO_CLIENTE}?text=${msg}`, "_blank");
  }

  renderProducts(productos);
  updateCartUI();
</script>
</body>
</html>
